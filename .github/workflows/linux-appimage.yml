name: Linux AppImage (unpublished)

# Builds the Linux desktop app as an AppImage on demand and keeps it as a
# workflow artifact. Nothing is published or tagged; this is the proof that
# the daemon, both web apps and the desktop shell package on Linux.
on:
  workflow_dispatch:
  # Also runs when its own files change, so a branch can prove the job before
  # it ever reaches the default branch (manual dispatch needs it there first).
  push:
    paths:
      - '.github/workflows/linux-appimage.yml'
      - 'apps/desktop/scripts/release-linux.mjs'

jobs:
  appimage:
    name: Package Linux x64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Linux packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y libfuse2 rpm

      - name: Install daemon dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install mobile-web dependencies
        working-directory: apps/mobile-web
        run: npm ci

      - name: Install console-web dependencies
        working-directory: apps/console-web
        run: npm ci

      - name: Build daemon
        run: npm run build

      - name: Build mobile-web
        working-directory: apps/mobile-web
        run: npm run build

      - name: Build console-web
        working-directory: apps/console-web
        run: npm run build

      - name: Build desktop shell
        working-directory: apps/desktop
        run: npm run build

      - name: Rebuild daemon natives for Electron
        working-directory: apps/desktop
        run: npm run rebuild-daemon-natives

      - name: Drop the daemon's build-only dependencies before packaging
        run: npm prune --omit=dev

      - name: Package AppImage
        working-directory: apps/desktop
        run: npm run package:linux

      - name: Smoke-launch the AppImage on a virtual display
        working-directory: apps/desktop
        run: |
          sudo apt-get install -y xvfb
          IMAGE=$(ls release/*.AppImage | head -1)
          chmod +x "$IMAGE"
          # The shell starts its daemon on first launch; the daemon answering
          # its own health route is the proof the Linux build runs end to end.
          xvfb-run -a bash -c "\"$IMAGE\" --appimage-extract-and-run --no-sandbox > release/smoke.log 2>&1 & APP=\$!; \
            for i in \$(seq 1 60); do sleep 3; \
              SECRET=\$(grep -E '^WEBHOOK_SECRET=' \$HOME/.clementine-next/.env 2>/dev/null | cut -d= -f2-); \
              if [ -n \"\$SECRET\" ] && curl -sf -o /dev/null -H \"Authorization: Bearer \$SECRET\" http://127.0.0.1:8520/api/console/health; then echo \"daemon answered after \$((i*3))s\"; kill \$APP; exit 0; fi; \
            done; echo 'the daemon never answered'; tail -40 release/smoke.log; kill \$APP; exit 1"

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-log-${{ github.run_id }}
          path: apps/desktop/release/smoke.log
          if-no-files-found: ignore

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: clementine-linux-appimage-${{ github.run_id }}
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error
