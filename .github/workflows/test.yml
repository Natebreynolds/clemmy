name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  notch-helper-macos:
    name: Native notch helper (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck desktop notch integration
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build native notch helper
        working-directory: apps/desktop
        run: npm run build:notch-helper

      - name: Probe native notch helper
        working-directory: apps/desktop
        run: >-
          node -e 'const { execFileSync } = require("node:child_process");
          const helper = "./native/notch-click-helper/.build/ClementineNotchHelper";
          const probe = JSON.parse(execFileSync(helper, ["--probe"], { encoding: "utf8" }));
          if (probe.type !== "probe" || probe.protocol !== 1) throw new Error(`Unexpected helper probe: ${JSON.stringify(probe)}`);'

  ios-tests:
    name: iOS unit tests
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Run Clem iOS tests
        working-directory: apps/ios
        run: |
          simulator_id="$(
            xcrun simctl list devices available |
              awk '/iPhone/ && ($NF == "(Shutdown)" || $NF == "(Booted)") { print $(NF - 1); exit }' |
              tr -d '()'
          )"
          test -n "$simulator_id"
          xcodebuild \
            -project Clem.xcodeproj \
            -scheme Clem \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:ClemTests \
            test

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check public repository hygiene
        run: npm run check:public-hygiene

      - name: Install dependencies
        run: npm ci

      - name: Test public repository hygiene gate
        run: npm run test:public-hygiene

      - name: Install mobile-web test dependencies
        working-directory: apps/mobile-web
        run: npm ci

      - name: Install console-web test dependencies
        working-directory: apps/console-web
        run: npm ci

      # The release-asset tests exercise apps/desktop/scripts/vendor-recall-native.mjs,
      # which imports 'tar' from apps/desktop's own dependencies — without this install
      # every main push/PR dies with ERR_MODULE_NOT_FOUND at 'Run release asset tests'
      # (mirrors the identical step in release-desktop.yml's preflight).
      - name: Install desktop test dependencies
        working-directory: apps/desktop
        run: npm ci

      # Run the node:test suite via tsx. The pattern matches every
      # *.test.ts file under src/ and apps/. Currently 100+ tests across:
      #   - memory: embeddings, recall, facts
      #   - agents: autonomy-v2, run-tracking, autonomy-guardrails, check-ins
      # If you add a new test file, this picks it up automatically.
      - name: Run tests
        run: npm test

      - name: Run canonical journeys sequentially
        run: npm run journeys

      # Measurement/benchmark layer (scripts/**) sits outside the npm-test
      # globs; explicit hermetic file list so a future daemon-spawning
      # selftest can never silently enter CI.
      - name: Run measurement-layer tests
        run: npm run test:measurement

      - name: Run proof self-tests
        run: npm run proof:selftest

      - name: Run release asset tests
        run: npm run test:release-assets

      - name: Run release closure tests
        run: |
          command -v sqlite3
          sqlite3 --version
          npm run test:release-closure

      - name: Build complete packaged candidate
        run: npm run prepack

      - name: Run post-build package and upgrade gates
        run: |
          npm run test:packed-candidate
          npm run test:packaged-upgrade

  gate-benchmark:
    name: Harness gate benchmark (violations prevented)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gates ON vs OFF: every safety gate must still PREVENT its trap (a
      # scenario that WOULD commit an irreversible rule violation). Fully
      # offline/deterministic — no model, no network, no auth. Exits non-zero
      # if any gate stops blocking, so a gate regression fails the build.
      # BLOCKING by design (the eval IS the harness). Run locally: npm run bench:gates
      - name: Run gate benchmark
        run: npm run bench:gates

  eval-suites:
    name: Eval suites (pass^k consistency + job evals)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # pass^k over the gate-benchmark TRAPS + golden JOB-run replays. Both are
      # fully offline/deterministic (stub judges / fixture replay under a temp
      # CLEMENTINE_HOME — no model, no network, no auth). STRICT mode exits
      # non-zero when pass^k drops below threshold, so a regressed trap or job
      # fails the build. BLOCKING by design — the eval IS the harness; this turns
      # forward-only into a build gate. Run locally: EVAL_PASSK_STRICT=on npm run
      # eval:passk  /  EVAL_JOBS_STRICT=on npm run eval:jobs
      - name: pass^k consistency (strict)
        run: EVAL_PASSK_STRICT=on npm run eval:passk

      - name: Job evals (strict)
        run: EVAL_JOBS_STRICT=on npm run eval:jobs

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  web-apps:
    name: Web app builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/mobile-web/package-lock.json
            apps/console-web/package-lock.json

      - name: Install mobile-web dependencies
        run: npm ci
        working-directory: apps/mobile-web

      - name: Install console-web dependencies
        run: npm ci
        working-directory: apps/console-web

      - name: Typecheck mobile-web
        run: npm run typecheck
        working-directory: apps/mobile-web

      - name: Build mobile-web
        run: npm run build
        working-directory: apps/mobile-web

      - name: Typecheck console-web
        run: npm run typecheck
        working-directory: apps/console-web

      - name: Build console-web
        run: npm run build
        working-directory: apps/console-web

  windows-smoke:
    name: Windows smoke (daemon boots + core suites)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install daemon dependencies
        run: npm ci

      - name: Typecheck daemon
        run: npx tsc --noEmit

      - name: Windows-readiness pins
        run: node scripts/run-tests-isolated.mjs src/runtime/windows-readiness.test.ts

      - name: Core suites on win32
        run: node scripts/run-tests-isolated.mjs src/tools/inner-dispatch.test.ts src/tools/composio-carrier.test.ts src/runtime/harness/logical-call-contract-refinement.test.ts

      - name: Daemon boot smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CLEMENTINE_HOME = Join-Path $env:RUNNER_TEMP 'clem-win-smoke'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:CLEMENTINE_HOME 'state') | Out-Null
          $env:MCP_AUTO_IMPORT_ENABLED = 'false'
          $log = Join-Path $env:RUNNER_TEMP 'daemon-smoke.log'
          $proc = Start-Process -FilePath 'npx.cmd' -ArgumentList 'tsx','src/index.ts','daemon','--foreground' `
            -RedirectStandardOutput $log -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'daemon-smoke.err.log') `
            -NoNewWindow -PassThru
          $deadline = (Get-Date).AddSeconds(150)
          $booted = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Daemon loop started' -Quiet)) { $booted = $true; break }
            if ($proc.HasExited) { break }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:RUNNER_TEMP 'daemon-smoke.err.log') -Tail 40 -ErrorAction SilentlyContinue
          if (-not $booted) { throw 'Daemon did not reach "Daemon loop started" on Windows.' }
          Write-Host 'Windows daemon boot smoke: OK'
