<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clementine" />
    <meta name="theme-color" content="#ffffff" />
    <!-- WebKit reads this before any CSS: it is what keeps the KEYBOARD and
         form controls light when the phone itself is in dark mode. The CSS
         color-scheme property alone does not reach the keyboard. -->
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/m/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/m/icon.svg" />
    <title>Clementine</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
