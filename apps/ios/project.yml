# XcodeGen spec for the Clem iOS command center.
#
# Regenerate the Xcode project after changing this file or adding sources:
#   cd apps/ios && xcodegen generate
#
# The generated Clem.xcodeproj is disposable and gitignored — this file is the
# source of truth, so the project never rots in code review.
name: Clem
options:
  bundleIdPrefix: ai.breakthroughcoaching
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # XcodeGen expands this from the developer/CI environment. Keep signing
    # identity local instead of committing an Apple team identifier.
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  Clem:
    type: application
    platform: iOS
    sources:
      - Clem
    entitlements:
      path: Clem/Clem.entitlements
      properties:
        # Driven by the build configuration, never by hand.
        #
        # THE DEFECT THIS FIXES. This was hardcoded to `development` with a
        # comment saying to "flip both together for TestFlight" — a manual step
        # before every upload, and the symptom of forgetting it is silent:
        # a TestFlight build gets a SANDBOX token, the daemon sends to the
        # production APNs host (apns.ts picks the host from APNS_ENV), Apple
        # answers BadDeviceToken, and the owner simply never gets notified.
        # A push product whose notifications quietly stop working in the
        # shipped build is worse than one with no push at all.
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.breakthroughcoaching.clem
        PRODUCT_NAME: Clem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Clem/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        CURRENT_PROJECT_VERSION: 14
        MARKETING_VERSION: 0.1.0
      configs:
        # Debug runs from Xcode against the sandbox, which is the daemon's
        # APNS_ENV default. Release covers TestFlight and the App Store, both
        # of which Apple serves from the production APNs environment.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  ClemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClemTests
    dependencies:
      - target: Clem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.breakthroughcoaching.clem.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
schemes:
  Clem:
    build:
      targets:
        Clem: all
        ClemTests: [test]
    test:
      targets:
        - ClemTests
